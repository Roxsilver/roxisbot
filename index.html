<!doctype html>
<!-- Befehls-Webseite von RoxisBot. Die Befehle kommen aus commands.json, die der Bot automatisch schreibt. -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Befehle · Roxsilver_</title>
  <meta name="description" content="Alle Chat-Befehle von RoxisBot im Twitch-Kanal von Roxsilver_.">
  <meta name="theme-color" content="#0b0909">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🤖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0909;
      --surface: #151011;
      --surface-2: #1e1617;
      --line: #332326;
      --text: #f3eeee;
      --muted: #a8999b;
      --accent: #e0142b;
      --accent-soft: rgba(224, 20, 43, 0.16);
      --light: #f1eeee;
      --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
      --display: 'Outfit', 'Segoe UI', system-ui, sans-serif;
      --body: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
    a { color: #ff6b75; }
    .wrap { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 16px; }

    /* ---------- Kopfbereich ---------- */
    .hero { position: relative; overflow: hidden; padding: 56px 0 40px; border-bottom: 1px solid var(--line); }
    .hero::before {
      content: ''; position: absolute; inset: -40% -10% auto; height: 520px; pointer-events: none;
      background: radial-gradient(ellipse at 30% 40%, rgba(224, 20, 43, 0.32), transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(255, 255, 255, 0.06), transparent 55%);
    }
    .hero-inner { position: relative; display: flex; gap: 28px; align-items: center; }
    .avatar {
      flex: none; width: 112px; height: 112px; border-radius: 50%; overflow: hidden;
      display: grid; place-items: center; background: var(--surface-2);
      font: 800 44px var(--display); color: var(--light);
      box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px var(--accent), 0 12px 40px rgba(224, 20, 43, 0.45);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .eyebrow { margin: 0 0 4px; font: 700 13px var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 0; font: 800 clamp(30px, 5vw, 46px)/1.08 var(--display); letter-spacing: -0.01em; }
    h1 .name-grad { background: linear-gradient(90deg, #fff 10%, #ff6b75 65%, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { margin: 10px 0 18px; color: var(--muted); max-width: 560px; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; }
    .link-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px;
      font-weight: 600; font-size: 15px; text-decoration: none; color: #fff; background: var(--surface-2);
      border: 1px solid var(--line); transition: border-color 0.15s, transform 0.15s;
    }
    .link-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    .link-btn.primary { background: var(--accent); border-color: var(--accent); }
    .link-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* ---------- Leiste mit Tabs und Suche ---------- */
    .toolbar { position: sticky; top: 0; z-index: 5; background: rgba(11, 9, 9, 0.86); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .toolbar-inner { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding-top: 14px; padding-bottom: 12px; }
    .tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .tab {
      border: 0; background: transparent; color: var(--muted); font: 600 15px var(--body);
      padding: 7px 14px; border-radius: 9px; cursor: pointer; white-space: nowrap;
    }
    .tab span { font-size: 12px; margin-left: 4px; opacity: 0.75; }
    .tab[aria-selected='true'] { background: var(--accent); color: #fff; }
    .tab:not([aria-selected='true']):hover { color: var(--text); }
    .search { position: relative; flex: 1 1 240px; max-width: 340px; }
    .search svg { position: absolute; left: 12px; top: 50%; width: 17px; height: 17px; transform: translateY(-50%); fill: var(--muted); }
    .search input {
      width: 100%; padding: 10px 12px 10px 38px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--surface); color: var(--text); font: inherit; font-size: 15px;
    }
    .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
      font: 500 14px var(--body); padding: 5px 12px; border-radius: 999px;
    }
    .chip:hover { color: var(--text); border-color: var(--accent); }
    .chip b { color: var(--text); font-weight: 600; }

    /* ---------- Befehlsliste ---------- */
    main { padding-top: 26px; padding-bottom: 40px; min-height: 50vh; }
    .group { margin-bottom: 30px; scroll-margin-top: 150px; }
    .group h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font: 700 20px var(--display); }
    .group h2 .count { font: 600 13px var(--body); color: var(--muted); background: var(--surface-2); padding: 1px 9px; border-radius: 999px; }
    .intro { margin: -4px 0 12px; max-width: 760px; color: var(--muted); }
    .intro code { font: 500 13.5px var(--mono); color: var(--light); background: var(--surface-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
    .rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .cmd { display: grid; grid-template-columns: minmax(170px, 230px) 96px 1fr; gap: 6px 18px; align-items: start; padding: 14px 18px; }
    .cmd + .cmd { border-top: 1px solid var(--line); }
    .cmd:hover { background: var(--surface-2); }
    .name {
      justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 2px 0;
      border: 0; background: none; color: var(--text); cursor: pointer; text-align: left;
      font: 700 15.5px var(--mono);
    }
    .name:hover code { color: #ff6b75; }
    .name code { font: inherit; word-break: break-word; }
    .arg { color: #ff6b75; font-weight: 500; }
    .alias { font: 600 11.5px var(--body); color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); padding: 0 6px; border-radius: 6px; }
    .perm { justify-self: start; font: 600 12.5px var(--body); padding: 2px 10px; border-radius: 999px; white-space: nowrap; margin-top: 2px; }
    .perm.everyone { background: rgba(255, 255, 255, 0.12); color: var(--light); }
    .perm.sub { background: rgba(224, 20, 43, 0.2); color: #ff6b75; }
    .perm.vip { background: rgba(224, 90, 208, 0.18); color: #f29ce6; }
    .perm.mod { background: rgba(62, 207, 142, 0.16); color: #6ee7b0; }
    .perm.broadcaster { background: rgba(255, 196, 0, 0.14); color: #ffd25e; }
    .desc { min-width: 0; color: #ddd3d4; overflow-wrap: anywhere; }
    .desc p { margin: 0; }
    .usage { display: inline-block; margin-bottom: 4px; font: 500 13.5px var(--mono); color: var(--light); background: #00000040; border: 1px solid var(--line); padding: 1px 8px; border-radius: 6px; }
    .ph { font: 600 13px var(--body); color: #ff6b75; background: var(--accent-soft); padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
    .desc .hint { margin-bottom: 6px; color: var(--text); font-weight: 600; font-size: 15px; }
    .hint code { font: 500 13.5px var(--mono); color: var(--light); background: #00000040; border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
    .desc .reply { padding-left: 10px; border-left: 2px solid var(--line); color: var(--muted); font-size: 15px; }
    .reply b { color: var(--text); font-weight: 600; }
    .state { text-align: center; color: var(--muted); padding: 60px 0; }

    footer { padding-top: 24px; padding-bottom: 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; text-align: center; }

    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
      background: var(--surface-2); border: 1px solid var(--accent); color: var(--text); padding: 10px 18px; border-radius: 12px;
      font-weight: 600; transition: opacity 0.2s, transform 0.2s; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 680px) {
      .hero { padding: 36px 0 28px; }
      .hero-inner { flex-direction: column; align-items: flex-start; gap: 18px; }
      .avatar { width: 84px; height: 84px; font-size: 34px; }
      .toolbar-inner { flex-direction: column; align-items: stretch; }
      .tabs { justify-content: space-between; }
      .tab { flex: 1; padding: 7px 8px; }
      .search { max-width: none; }
      .cmd { grid-template-columns: 1fr auto; padding: 13px 14px; }
      .desc { grid-column: 1 / -1; }
      .group { scroll-margin-top: 200px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="wrap hero-inner">
      <div class="avatar" id="avatar">R</div>
      <div>
        <p class="eyebrow">RoxisBot · Chat-Befehle</p>
        <h1><span class="name-grad" id="channel">Roxsilver_</span></h1>
        <p class="sub">Schreib einen Befehl einfach in den Twitch-Chat. Klick auf einen Befehl, um ihn zu kopieren.</p>
        <div class="links" id="links"></div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="wrap toolbar-inner">
      <div class="tabs" role="tablist" id="tabs"></div>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
        <input id="search" type="search" placeholder="Befehl suchen …" autocomplete="off" aria-label="Befehl suchen">
      </label>
    </div>
    <div class="wrap chips" id="chips"></div>
  </div>

  <main class="wrap" id="list"><p class="state">Lade Befehle …</p></main>

  <footer class="wrap">Automatisch erstellt von <b>RoxisBot</b> – neue Befehle erscheinen hier von selbst.</footer>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const PERMS = { everyone: 'Alle', sub: 'Subs', vip: 'VIPs', mod: 'Mods', broadcaster: 'Streamer' };
    const MOD_LEVELS = new Set(['mod', 'broadcaster']);
    const PLACEHOLDERS = { user: 'dein Name', target: 'Name', args: 'dein Text', uses: 'Anzahl', count: 'Zahl', channel: 'Kanal', random: 'Zufallszahl' };
    const TABS = [['all', 'Alle'], ['viewer', 'Zuschauer'], ['mod', 'Mods']];
    const ICONS = {
      twitch: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.3 2 3 5.4v13.8h4.7V22h2.6l2.7-2.8h3.9L22 14V2H4.3Zm15.9 11.1-3.1 3.2H12l-2.6 2.6v-2.6h-4V3.8h14.8v9.3ZM16.6 7v5.4h-1.8V7h1.8Zm-4.9 0v5.4H9.9V7h1.8Z"/></svg>',
      discord: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.6 5.3A17 17 0 0 0 15.4 4l-.5 1.1a15.8 15.8 0 0 0-5.8 0L8.6 4a17 17 0 0 0-4.2 1.3A17.6 17.6 0 0 0 1.4 17a17 17 0 0 0 5.2 2.6l1.1-1.8a11 11 0 0 1-1.7-.8l.4-.3a12.2 12.2 0 0 0 11.2 0l.4.3-1.7.8 1.1 1.8a17 17 0 0 0 5.2-2.6 17.5 17.5 0 0 0-3-11.7ZM8.7 14.7c-1 0-1.9-1-1.9-2.1s.8-2.2 1.9-2.2 1.9 1 1.9 2.2-.8 2.1-1.9 2.1Zm6.6 0c-1 0-1.9-1-1.9-2.1s.8-2.2 1.9-2.2 1.9 1 1.9 2.2-.8 2.1-1.9 2.1Z"/></svg>',
      link: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3.5-3.5a3 3 0 1 1 4.2 4.2l-2.1 2.1-1.4-1.4 2.1-2.1a1 1 0 1 0-1.4-1.4L12 13.4a1 1 0 0 1-1.4 0ZM13.4 10.6a1 1 0 0 1 0 1.4l-3.5 3.5a3 3 0 1 1-4.2-4.2l2.1-2.1 1.4 1.4-2.1 2.1a1 1 0 1 0 1.4 1.4L12 10.6a1 1 0 0 1 1.4 0Z"/></svg>',
    };

    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

    let data = null;
    let tab = { '#zuschauer': 'viewer', '#mods': 'mod' }[location.hash] ?? 'all';
    let query = '';
    let toastTimer = null;

    const isMod = (c) => MOD_LEVELS.has(c.permission);
    const inTab = (c, t) => (t === 'all' ? true : t === 'mod' ? isMod(c) : !isMod(c));

    /** Text mit klickbaren Links und hervorgehobenen Platzhaltern wie {user} */
    function richText(text) {
      return esc(text)
        .replace(/https?:\/\/[^\s<]+/g, (url) => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`)
        .replace(/\{(\w+)\}/g, (match, key) => `<span class="ph" title="Wird ersetzt durch: ${esc(PLACEHOLDERS[key] ?? key)}">${esc(PLACEHOLDERS[key] ?? key)}</span>`);
    }

    /** Befehle stehen im Einleitungstext in `Backticks` */
    const introText = (text) => esc(text).replace(/`([^`]+)`/g, '<code>$1</code>');

    function categoryOrder() {
      const viewer = data.order.viewer;
      if (tab === 'mod') return data.order.mod;
      return [...viewer, ...data.order.mod.filter((key) => !viewer.includes(key))];
    }

    function matches(c) {
      const q = query.trim().toLowerCase().replace(/^!/, '');
      if (!q) return true;
      return [c.name, ...c.aliases, c.description, c.usage ?? ''].some((s) => s.toLowerCase().includes(q));
    }

    /** Eigene Commands verraten über ihre Platzhalter, ob man etwas dazuschreiben kann */
    function extraInput(c) {
      if (!c.custom) return null;
      if (c.description.includes('{target}')) return { arg: '@Name', copy: ' @', example: '@Freund', note: 'Ohne Namen triffst du dich selbst.' };
      if (c.description.includes('{args}')) return { arg: 'Text', copy: ' ', example: 'dein Text', note: '' };
      return null;
    }

    function details(c, command, extra) {
      if (!c.custom) return `${c.usage ? `<code class="usage">${esc(c.usage)}</code>` : ''}<p>${richText(c.description)}</p>`;
      const hint = extra ? `<p class="hint">👉 So geht's: <code>${esc(command)} ${esc(extra.example)}</code> ${esc(extra.note)}</p>` : '';
      return `${hint}<p class="reply"><b>Bot:</b> ${richText(c.description)}</p>`;
    }

    function row(c) {
      const command = data.prefix + c.name;
      const aliases = c.aliases.map((a) => data.prefix + a);
      const extra = extraInput(c);
      return `<article class="cmd">
        <button class="name" data-copy="${esc(command + (extra?.copy ?? ''))}" title="Klicken zum Kopieren">
          <code>${esc(command)}${extra ? ` <span class="arg">${esc(extra.arg)}</span>` : ''}</code>${aliases.length ? `<span class="alias" title="Geht auch: ${esc(aliases.join(', '))}">+${aliases.length}</span>` : ''}
        </button>
        <span class="perm ${esc(c.permission)}">${PERMS[c.permission] ?? esc(c.permission)}</span>
        <div class="desc">${details(c, command, extra)}</div>
      </article>`;
    }

    function render() {
      $('tabs').innerHTML = TABS.map(([key, label]) => {
        const count = data.commands.filter((c) => inTab(c, key)).length;
        return `<button class="tab" role="tab" data-tab="${key}" aria-selected="${tab === key}">${label}<span>${count}</span></button>`;
      }).join('');

      const list = data.commands.filter((c) => inTab(c, tab) && matches(c));
      const groups = categoryOrder()
        .map((key) => [key, list.filter((c) => c.category === key)])
        .filter(([, commands]) => commands.length);

      $('chips').innerHTML = groups.map(([key, commands]) => {
        const cat = data.categories[key];
        return `<button class="chip" data-jump="cat-${key}">${cat.emoji} ${esc(cat.label)} <b>${commands.length}</b></button>`;
      }).join('');

      $('list').innerHTML = groups.length
        ? groups.map(([key, commands]) => {
          const cat = data.categories[key];
          return `<section class="group" id="cat-${key}">
            <h2><span aria-hidden="true">${cat.emoji}</span>${esc(cat.label)}<span class="count">${commands.length}</span></h2>
            ${cat.intro ? `<p class="intro">${introText(cat.intro)}</p>` : ''}
            <div class="rows">${commands.map(row).join('')}</div>
          </section>`;
        }).join('')
        : `<p class="state">Kein Befehl gefunden für „${esc(query)}“.</p>`;
    }

    function renderHeader() {
      document.title = `Befehle · ${data.channel}`;
      $('channel').textContent = data.channel;
      if (data.avatar) $('avatar').innerHTML = `<img src="${esc(data.avatar)}" alt="">`;
      else $('avatar').textContent = data.channel.charAt(0).toUpperCase();

      const links = [['twitch', 'Twitch', data.links.twitch ?? `https://twitch.tv/${data.login}`, true]];
      if (data.links.discord) links.push(['discord', 'Discord', data.links.discord, false]);
      for (const [label, url] of Object.entries(data.links)) {
        if (label !== 'twitch' && label !== 'discord') links.push(['link', label, url, false]);
      }
      $('links').innerHTML = links.map(([icon, label, url, primary]) => `<a class="link-btn ${primary ? 'primary' : ''}" href="${esc(url)}" target="_blank" rel="noopener">${ICONS[icon]}${esc(label)}</a>`).join('');
    }

    function toast(text) {
      $('toast').textContent = text;
      $('toast').classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);
    }

    document.addEventListener('click', (e) => {
      const button = e.target.closest('button');
      if (!button) return;
      if (button.dataset.tab) {
        tab = button.dataset.tab;
        history.replaceState(null, '', { all: location.pathname, viewer: '#zuschauer', mod: '#mods' }[tab]);
        render();
      } else if (button.dataset.jump) {
        $(button.dataset.jump)?.scrollIntoView({ block: 'start' });
      } else if (button.dataset.copy) {
        navigator.clipboard?.writeText(button.dataset.copy).then(() => toast(`${button.dataset.copy} kopiert`), () => {});
      }
    });

    $('search').addEventListener('input', (e) => {
      query = e.target.value;
      render();
    });

    fetch('commands.json', { cache: 'no-store' })
      .then((res) => {
        if (!res.ok) throw new Error(res.status);
        return res.json();
      })
      .then((json) => {
        data = json;
        renderHeader();
        render();
      })
      .catch(() => {
        $('list').innerHTML = '<p class="state">Die Befehle konnten gerade nicht geladen werden. Bitte später nochmal versuchen.</p>';
      });
  </script>
</body>
</html>
